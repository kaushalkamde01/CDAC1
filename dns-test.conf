input {
  stdin {
    codec => json
  }
}

filter {
  if [log][file][path] =~ /\/var\/log\/named\/.*query.*\.log$/ {
    mutate {
      replace => {
        "[event][dataset]" => "dns.query"
      }
    }

    grok {
      match => {
        "[event][original]" => [
          '^%{MONTHDAY:[dnslog][day]}-%{MONTH:[dnslog][month]}-%{YEAR:[dnslog][year]} %{TIME:[dnslog][time]} client(?: @%{DATA})? %{IP:[source][ip]}#%{POSINT:[source][port]:int} \(%{DATA:[dnslog][query_context]}\): query: %{DATA:[dns][question][name]} IN %{WORD:[dns][question][type]} %{GREEDYDATA:[dnslog][flags]}$
          '^%{MONTHDAY:[dnslog][day]}-%{MONTH:[dnslog][month]}-%{YEAR:[dnslog][year]} %{TIME:[dnslog][time]} client %{IP:[source][ip]}#%{POSINT:[source][port]:int}: query: %{DATA:[dns][question][name]} IN %{WORD:[dns][question][type]} %{GREEDYDATA:[dnslog][flags]}$'
        ]
      }
      tag_on_failure => ["_dns_query_parse_failure"]
    }

    mutate {
      add_field => {
        "[event][category]" => "network"
        "[event][type]" => "protocol"
        "[event][action]" => "dns_query"
        "[network][protocol]" => "dns"
        "[network][transport]" => "udp"
        "[@metadata][dns_timestamp]" => "%{[dnslog][day]}-%{[dnslog][month]}-%{[dnslog][year]} %{[dnslog][time]}"
      }

      lowercase => [
        "[dns][question][name]",
        "[dns][question][type]"
      ]
    }

    date {
      match => [
        "[@metadata][dns_timestamp]",
        "dd-MMM-yyyy HH:mm:ss.SSS",
        "dd-MMM-yyyy HH:mm:ss"
      ]
      target => "@timestamp"
      tag_on_failure => ["_dns_timestamp_failure"]
    }
  }
}

output {
  stdout {
    codec => rubydebug {
      metadata => true
    }
  }
}
