input {
 beats {
  port => 5044
 }
}

filter {
 if [event][dataset] == "aws.cloudtrail" and [event][original] {
  json {
   source => "[event][original]"
   target => "[aws][cloudtrail]"
   tag_on_failure => ["_cloudtrail_json_failure", "_parser_failure"]
  }

  mutate {
   add_field => {
    "[event][kind]" => "event"
    "[event][category]" => "configuration"
    "[event][type]" => "info"
   }
  }

  if [aws][cloudtrail][eventName] {
   mutate {
    copy => {
     "[aws][cloudtrail][eventName]" => "[event][action]"
    }
   }
  }

  if [aws][cloudtrail][eventSource] {
   mutate {
    copy => {
     "[aws][cloudtrail][eventSource]" => "[service][name]"
    }
   }
  }

  date {
   match => ["[aws][cloudtrail][eventTime]", "ISO8601"]
   target => "@timestamp"
   tag_on_failure => ["_cloudtrail_timestamp_failure", "_parser_failure"]
  }
 }

 else if [log][file][path] =~ "^/var/log/cicd/" {
  mutate {
   replace => {
    "[event][dataset]" => "cicd.pipeline"
   }
  }

  grok {
   match => {
    "[event][original]" => '^%{TIMESTAMP_ISO8601:[cicd][timestamp]} pipeline=%{NOTSPACE:[cicd][pipeline]} build=%{INT:[cicd][build_number]:int} status=%{WORD:[cicd][status]} branch=%{NOTSPACE:[cicd][branch]} duraction=%{INT:[event][duration]:int}$'
   }
   tag_on_failure => ["_cicd_parse_failure", "_parser_failure"]
  }

  mutate {
   add_field => {
    "[event][category]" => "process"
    "[event][type]" => "info"
    "[event][action]" => "build"
   }
  }
 if [cicd][status] =~ /(?i)^(success|passed)$/ {
   mutate {
    add_field => {
     "[event][outcome]" => "success"
    }
   }
  }

  else if [cicd][status] =~ /(?i)^(failed|failure|error)$/ {
   mutate {
    add_field => {
     "[event][outcome]" => "failure"
    }
   }
  }
 }

 else if [type] == "auditbeat" {
  mutate {
   add_field => {
    "[event][dataset]" => "auditbeat"
   }
  }

  if [service][type] == "file_integrity" {
   mutate {
    add_field => {
     "[event][category]" => "file"
     "[event][action]" => "file_integrity_change"
     "[threat][technique][name]" => "File Integrity Monitoring"
    }
   }
  }

  else if [process][name] == "sudo" {
   mutate {
    add_field => {
     "[event][category]" => "privilege"
     "[event][action]" => "sudo_usage"
     "[threat][technique][name]" => "Privilege Escalation"
    }
   }
  }
 }

 else if [log][file][path] =~ "eve\.json$" {

  if [event][original] {
   json {
    source => "[event][original]"
    target => "[suricata]"
    tag_on_failure => ["_suricata_json_failure", "_parser_failure"]
   }
  }
  else {
   json {
    source => "message"
    target => "[suricata]"
    tag_on_failure => ["_suricata_json_failure", "_parser_failure"]
   }
  }

  mutate {
   replace => {
    "[event][dataset]" => "suricata.%{[suricata][event_type]}"
   }
  }

  if [suricata][event_type] == "alert" {
   mutate {
    add_field => {
     "[event][kind]" => "alert"
     "[event][category]" => "network"
     "[event][type]" => "indicator"

     "[source][ip]" => "%{[suricata][src_ip]}"
     "[source][port]" => "%{[suricata][src_port]}"

     "[destination][ip]" => "%{[suricata][dest_ip]}"
     "[destination][port]" => "%{[suricata][dest_port]}"

     "[network][transport]" => "%{[suricata][proto]}"

     "[rule][name]" => "%{[suricata][alert][signature]}"
     "[rule][category]" => "%{[suricata][alert][category]}"

     "[event][severity]" => "%{[suricata][alert][severity]}"
    }
   }

   mutate {
    lowercase => ["[network][transport]"]
    convert => {
     "[source][port]" => "integer"
     "[destination][port]" => "integer"
     "[event][severity]" => "integer"
    }
   }
  }
  else {
   mutate {
    add_field => {
     "[event][kind]" => "event"
     "[event][category]" => "network"
     "[event][type]" => "info"
    }
   }

   if [suricata][src_ip] {
    mutate {
     add_field => {
      "[source][ip]" => "%{[suricata][src_ip]}"
      "[source][port]" => "%{[suricata][src_port]}"
      "[destination][ip]" => "%{[suricata][dest_ip]}"
      "[destination][port]" => "%{[suricata][dest_port]}"
      "[network][transport]" => "%{[suricata][proto]}"
     }
    }

    mutate {
     lowercase => ["[network][transport]"]
     convert => {
      "[source][port]" => "integer"
      "[destination][port]" => "integer"
     }
    }
   }
  }

  date {
   match => ["[suricata][timestamp]", "ISO8601"]
   target => "@timestamp"
   tag_on_failure => ["_suricata_timestamp_failure", "_parser_failure"]
  }
 }

 else if [log][file][path] =~ "/var/log/nginx/access.log" {
  mutate {
   replace => {
    "[event][dataset]" => "nginx.access"
   }
  }

  grok {
   match => {
    "[event][original]" => '^%{IPORHOST:[source][ip]} - %{DATA:[user][name]} \[%{HTTPDATE:[nginx][access][time]}\] "%{WORD:[http][request][method]} %{DATA:[url][original]} HTTP/%{NUMBER:[http][version]}" %{INT:[http][response][status_code]:int} (?:%{INT:[http][response][body][bytes]:int}|-) "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}"'
   }
   tag_on_failure => ["_nginx_access_parse_failure", "_parser_failure"]
  }
  if [url][original] =~ /(?i)(union.*select|select.*from|or\s+1=1|%27|')/ {
   mutate {
    add_field => {
     "[event][category]" => "web"
     "[event][type]" => "indicator"
     "[event][action]" => "sql_injection_attempt"
     "[threat][technique][name]" => "SQL Injection"
    }
   }
  }

  else if [url][original] =~ /(?i)(<script|%3cscript|javascript:|onerror=|onload=)/ {
   mutate {
    add_field => {
     "[event][category]" => "web"
     "[event][type]" => "indicator"
     "[event][action]" => "xss_attempt"
     "[threat][technique][name]" => "Cross-Site Scripting"
    }
   }
  }

  else if [url][original] =~ /(?i)(\.\.\/|%2e%2e%2f|%252e%252e%252f)/ {
   mutate {
    add_field => {
     "[event][category]" => "web"
     "[event][type]" => "indicator"
     "[event][action]" => "path_traversal_attempt"
     "[threat][technique][name]" => "Path Traversal"
    }
   }
  }

  else if [url][original] =~ /(?i)(\/admin|\/wp-admin|\/phpmyadmin|\/\.env|\/etc\/passwd)/ {
   mutate {
    add_field => {
     "[event][category]" => "web"
     "[event][type]" => "indicator"
     "[event][action]" => "sensitive_path_scan"
    }
   }
  }
 }

 else if [log][file][path] == "/var/log/nginx/error.log" {
  mutate {
   replace => {
    "[event][dataset]" => "nginx.error"
   }
  }
 }

 else if [log][file][path] == "/var/log/auth.log"{
  mutate {
   replace => {
    "[event][dataset]" => "system.auth"
   }
  }

  grok {
   match => {
    "[event][original]" => "^%{SYSLOGTIMESTAMP:[system][auth][timestamp]} %{HOSTNAME:[system][auth][hostname]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:[system][auth][message]}$"
   }
   tag_on_failure => ["_auth_header_parse_failure", "_parser_failure"]
  }

  if [system][auth][message] =~ /^Failed password/ {
   grok {
    match => {
     "[system][auth][message]" => "^Failed password for (?:invalid user )?%{DATA:[user][name]} from %{IP:[source][ip]} port %{POSINT:[source][port]:int} %{WORD:[network][transport]}$"
    }
    tag_on_failure => ["_ssh_failed_login_parse_failure", "_parser_failure"]
   }

   mutate {
    add_field => {
     "[event][category]" => "authentication"
     "[event][type]" => "start"
     "[event][outcome]" => "failure"
     "[event][action]" => "ssh_login"
     "[service][name]" => "ssh"
    }
   }
  }
 }

 else if [log][file][path] =~ /\/var\/log\/named\/.*query.*\.log$/ {
  mutate {
   replace => {
    "[event][dataset]" => "dns.query"
   }
  }

  grok {
   match => {
    "[event][original]" => [
     '^%{MONTHDAY:[dnslog][day]}-%{MONTH:[dnslog][month]}-%{YEAR:[dnslog][year]} %{TIME:[dnslog][time]} %{DATA}client(?: @%{DATA})? %{IP:[source][ip]}#%{POSINT:[source][port]:int} \(%{DATA:[dnslog][query_context]}\): query: %{DATA:[dns][question][name]} IN %{WORD:[dns][question][type]} %{GREEDYDATA:[dnslog][flags]}$',
     '^%{MONTHDAY:[dnslog][day]}-%{MONTH:[dnslog][month]}-%{YEAR:[dnslog][year]} %{TIME:[dnslog][time]} client %{IP:[source][ip]}#%{POSINT:[source][port]:int}: query: %{DATA:[dns][question][name]} IN %{WORD:[dns][question][type]} %{GREEDYDATA:[dnslog][flags]}$'
    ]
   }

   tag_on_failure => ["_dns_query_parse_failure", "_parser_failure"]
  }

  mutate {
   add_field => {
    "[event][category]" => "network"
    "[event][type]" => "protocol"
    "[event][action]" => "dns_query"
    "[network][protocol]" => "dns"
    "[network][transport]" => "udp"
   }
   lowercase => [
    "[dns][question][name]",
    "[dns][question][type]"
   ]
  }

  mutate {
   add_field => {
    "[@metadata][dns_timestamp]" => "%{[dnslog][day]}-%{[dnslog][month]}-%{[dnslog][year] %{[dnslog][time]}}"
   }
  }

  date {
   match => [
    "[@metadata][dns_timestamp]",
    "dd-MMM-yyyy HH:mm:ss.SSS",
    "dd-MMM-yyyy HH:mm:ss"
   ]

   target => "@timestamp"
   tag_on_failure => ["_dns_timestamp_failure", "_parser_failure"]
  }
 }

 else if [agent][type] == "winlogbeat" {

  if [winlog][channel] == "Security" {
   mutate {
    replace => {
     "[event][dataset]" => "windows.security"
    }
   }
  }
  else if [winlog][channel] == "System" {
   mutate {
    replace => {
     "[event][dataset]" => "windows.system"
    }
   }
  }
  else if [winlog][channel] == "Application" {
   mutate {
    replace => {
     "[event][dataset]" => "windows.application"
    }
   }
  }
  else {
   mutate {
    replace => {
     "[event][dataset]" => "windows.other"
    }
   }
  }

  if [winlog][event_id] == "4624" {
   mutate {
    replace => {
     "[event][category]" => "authentication"
     "[event][type]" => "start"
     "[event][action]" => "logon"
     "[event][outcome]" => "success"
    }
   }
  }
  else if [winlog][event_id] == "4625" {
   mutate {
    replace => {
     "[event][category]" => "authentication"
     "[event][type]" => "start"
     "[event][action]" => "logon"
     "[event][outcome]" => "failure"
     "[threat][technique][name]" => "Brute Force"
    }
   }
  }
  else if [winlog][event_id] == "4634" {
   mutate {
    replace => {
     "[event][category]" => "authentication"
     "[event][type]" => "end"
     "[event][action]" => "logoff"
    }
   }
  }
  else if [winlog][event_id] == "4720" {
   mutate {
    replace => {
     "[event][category]" => "iam"
     "[event][type]" => "creation"
     "[event][action]" => "user_account_created"
    }
   }
  }
  else if [winlog][event_id] == "4725" {
   mutate {
    replace => {
     "[event][category]" => "iam"
     "[event][type]" => "user"
     "[event][action]" => "user_account_disabled"
    }
   }
  }
  else if [winlog][event_id] == "4726" {
   mutate {
    replace => {
     "[event][category]" => "iam"
     "[event][type]" => "deletion"
     "[event][action]" => "user_account_deleted"
    }
   }
  }
  else if [winlog][event_id] == "4728" or [winlog][event_id] == "4732" or [winlog][event_id] == "4756" {
   mutate {
    replace => {
     "[event][category]" => "iam"
     "[event][type]" => "group"
     "[event][action]" => "group_member_added"
     "[threat][technique][name]" => "Account Manipulation"
    }
   }
  }
  else if [winlog][event_id] == "4729" or [winlog][event_id] == "4733" or [winlog][event_id] == "4757" {
   mutate {
    replace => {
     "[event][category]" => "iam"
     "[event][type]" => "group"
     "[event][action]" => "group_member_removed"
    }
   }
  }
  else if [winlog][event_id] == "4738" {
   mutate {
    replace => {
     "[event][category]" => "iam"
     "[event][type]" => "change"
     "[event][action]" => "user_account_changed"
    }
   }
  }
  else if [winlog][event_id] == "4740" {
   mutate {
    replace => {
     "[event][category]" => "iam"
     "[event][type]" => "user"
     "[event][action]" => "account_locked_out"
     "[threat][technique][name]" => "Brute Force"
    }
   }
  }
  else if [winlog][event_id] == "4767" {
   mutate {
    replace => {
     "[event][category]" => "iam"
     "[event][type]" => "user"
     "[event][action]" => "account_unlocked"
    }
   }
  }
  else if [winlog][event_id] == "4771" {
   mutate {
    replace => {
     "[event][category]" => "authentication"
     "[event][type]" => "start"
     "[event][action]" => "kerberos_preauth_failed"
     "[event][outcome]" => "failure"
     "[threat][technique][name]" => "Brute Force"
    }
   }
  }
  else if [winlog][event_id] == "4776" {
   mutate {
    replace => {
     "[event][category]" => "authentication"
     "[event][action]" => "credential_validation"
    }
   }
  }
  else if [winlog][event_id] == "5136" {
   mutate {
    replace => {
     "[event][category]" => "configuration"
     "[event][type]" => "change"
     "[event][action]" => "directory_object_modified"
    }
   }
  }

  if [winlog][event_data][TargetUserName] {
   mutate {
    copy => {
     "[winlog][event_data][TargetUserName]" => "[user][target][name]"
    }
   }
  }

  if [winlog][event_data][SubjectUserName] {
   mutate {
    copy => {
     "[winlog][event_data][SubjectUserName]" => "[user][name]"
    }
   }
  }

  if [winlog][event_data][IpAddress] and [winlog][event_data][IpAddress] != "-" {
   mutate {
    copy => {
     "[winlog][event_data][IpAddress]" => "[source][ip]"
    }
   }
  }
 }

 else if ![event][dataset] {
  mutate {
   add_field => {
    "[event][dataset]" => "unknown"
   }
  }
 }

 mutate {
  add_field => {
   "[@metadata][processing_stage]" => "ingested"
  }
 }

 if [source][ip] {
  geoip {
   source => "[source][ip]"
   target => "[source][geo]"
  }
 }

 if [destination][ip] {
  geoip {
   source => "[destination][ip]"
   target => "[destination][geo]"
  }
 }
}

output {
 kafka {
  bootstrap_servers => "kafka:9092"
  topic_id => "soc-events"
  codec => json
 }
}
