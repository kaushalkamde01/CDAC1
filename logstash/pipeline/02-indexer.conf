input {
 kafka {
  bootstrap_servers => "kafka:9092"
  topics => ["soc-events"]
  group_id => "logstash-indexers"
  codec => json
  auto_offset_reset => "earliest"
 }

}

filter {
 if ![event][dataset] {
  mutate {
   add_field => {
    "[event][dataset]" => "unknown"
   }
  }
 }

 if [event][dataset] == "suricata.dns" and [suricata][dns][rrname] {

  elasticsearch {
   hosts => ["http://elasticsearch:9200"]
   user => "elastic"
   password => "${ELASTIC_PASSWORD}"
   index => "misp-ioc-intelligence"

   query => 'threat.indicator.value.keyword:"%{[suricata][dns][rrname]}" AND threat.indicator.type.keyword:"domain"'

   fields => {
    "[threat][indicator][value]" => "[@metadata][misp_ioc_value]"
    "[threat][indicator][type]" => "[@metadata][misp_ioc_type]"
    "[threat][indicator][provider]" => "[@metadata][misp_ioc_provider]"
   }
  }

  if [@metadata][misp_ioc_value] {
   mutate {
    add_field => {
     "[threat][indicator][matched][atomic]" => "%{[@metadata][misp_ioc_value]}"
     "[threat][indicator][matched][type]" => "%{[@metadata][misp_ioc_type]}"
     "[threat][indicator][matched][provider]" => "%{[@metadata][misp_ioc_provider]}"
    }
   }
  }
 }

 if "_parser_failure" in [tags] or
    "_grokparsefailure" in [tags] or
    "_jsonparsefailure" in [tags] {

  mutate {
   remove_field => ["[event][kind]"]
  }

  mutate {
   add_field => {
    "[event][kind]" => "pipeline_error"
    "[error][type]" => "parser_failure"
    "[error][message]" => "Logstash could not fully parse this event"
    "[@metadata][index_route]" => "failed"
   }
  }
 }

 else {
  mutate {
   remove_field => ["message"]
   add_field => {
    "[@metadata][index_route]" => "normal"
   }
  }
 }
}

output {
 if [@metadata][index_route] == "failed" {
  elasticsearch {
   hosts => ["http://elasticsearch:9200"]
   #later convert the http to https for final run
   user => "elastic"

   password => "${ELASTIC_PASSWORD}"

   index => "soc-failed-%{+YYYY.MM.dd}"
  }
 }

 else {
  elasticsearch {
   hosts => ["http://elasticsearch:9200"]
   user => "elastic"
   password => "${ELASTIC_PASSWORD}"
   index => "soc-%{[event][dataset]}-%{+YYYY.MM.dd}"
  }
 }
}
