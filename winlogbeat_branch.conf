 else if [agent][type] == "winlogbeat" {

  if [winlog][channel] == "Security" {
   mutate {
    replace => {
     "[event][dataset]" => "windows.security"
    }
   }
  }
  else if [winlog][channel] == "System" {
   mutate {
    replace => {
     "[event][dataset]" => "windows.system"
    }
   }
  }
  else if [winlog][channel] == "Application" {
   mutate {
    replace => {
     "[event][dataset]" => "windows.application"
    }
   }
  }
  else {
   mutate {
    replace => {
     "[event][dataset]" => "windows.other"
    }
   }
  }

  if [winlog][event_id] == 4624 {
   mutate {
    add_field => {
     "[event][category]" => "authentication"
     "[event][type]" => "start"
     "[event][action]" => "logon"
     "[event][outcome]" => "success"
    }
   }
  }
  else if [winlog][event_id] == 4625 {
   mutate {
    add_field => {
     "[event][category]" => "authentication"
     "[event][type]" => "start"
     "[event][action]" => "logon"
     "[event][outcome]" => "failure"
     "[threat][technique][name]" => "Brute Force"
    }
   }
  }
  else if [winlog][event_id] == 4634 {
   mutate {
    add_field => {
     "[event][category]" => "authentication"
     "[event][type]" => "end"
     "[event][action]" => "logoff"
    }
   }
  }
  else if [winlog][event_id] == 4720 {
   mutate {
    add_field => {
     "[event][category]" => "iam"
     "[event][type]" => "creation"
     "[event][action]" => "user_account_created"
    }
   }
  }
  else if [winlog][event_id] == 4725 {
   mutate {
    add_field => {
     "[event][category]" => "iam"
     "[event][type]" => "user"
     "[event][action]" => "user_account_disabled"
    }
   }
  }
  else if [winlog][event_id] == 4726 {
   mutate {
    add_field => {
     "[event][category]" => "iam"
     "[event][type]" => "deletion"
     "[event][action]" => "user_account_deleted"
    }
   }
  }
  else if [winlog][event_id] == 4728 or [winlog][event_id] == 4732 or [winlog][event_id] == 4756 {
   mutate {
    add_field => {
     "[event][category]" => "iam"
     "[event][type]" => "group"
     "[event][action]" => "group_member_added"
     "[threat][technique][name]" => "Account Manipulation"
    }
   }
  }
  else if [winlog][event_id] == 4729 or [winlog][event_id] == 4733 or [winlog][event_id] == 4757 {
   mutate {
    add_field => {
     "[event][category]" => "iam"
     "[event][type]" => "group"
     "[event][action]" => "group_member_removed"
    }
   }
  }
  else if [winlog][event_id] == 4738 {
   mutate {
    add_field => {
     "[event][category]" => "iam"
     "[event][type]" => "change"
     "[event][action]" => "user_account_changed"
    }
   }
  }
  else if [winlog][event_id] == 4740 {
   mutate {
    add_field => {
     "[event][category]" => "iam"
     "[event][type]" => "user"
     "[event][action]" => "account_locked_out"
     "[threat][technique][name]" => "Brute Force"
    }
   }
  }
  else if [winlog][event_id] == 4767 {
   mutate {
    add_field => {
     "[event][category]" => "iam"
     "[event][type]" => "user"
     "[event][action]" => "account_unlocked"
    }
   }
  }
  else if [winlog][event_id] == 4771 {
   mutate {
    add_field => {
     "[event][category]" => "authentication"
     "[event][type]" => "start"
     "[event][action]" => "kerberos_preauth_failed"
     "[event][outcome]" => "failure"
     "[threat][technique][name]" => "Brute Force"
    }
   }
  }
  else if [winlog][event_id] == 4776 {
   mutate {
    add_field => {
     "[event][category]" => "authentication"
     "[event][action]" => "credential_validation"
    }
   }
  }
  else if [winlog][event_id] == 5136 {
   mutate {
    add_field => {
     "[event][category]" => "configuration"
     "[event][type]" => "change"
     "[event][action]" => "directory_object_modified"
    }
   }
  }

  if [winlog][event_data][TargetUserName] {
   mutate {
    copy => {
     "[winlog][event_data][TargetUserName]" => "[user][target][name]"
    }
   }
  }

  if [winlog][event_data][SubjectUserName] {
   mutate {
    copy => {
     "[winlog][event_data][SubjectUserName]" => "[user][name]"
    }
   }
  }

  if [winlog][event_data][IpAddress] and [winlog][event_data][IpAddress] != "-" {
   mutate {
    copy => {
     "[winlog][event_data][IpAddress]" => "[source][ip]"
    }
   }
  }
 }
